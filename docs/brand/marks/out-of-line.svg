<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Maverick Wall — Out of Line">
  <!--
    One cell steps out of rank, and its slot is left empty.

    The half-cell horizontal offset is deliberate: aligned to the column it
    left, the displacement reads as a missing row rather than a decision.
  -->
  <g fill="var(--mw-neutral, #6B7684)" fill-opacity=".34">
    <rect x="8" y="20" width="6" height="6" rx="1"/><rect x="15" y="20" width="6" height="6" rx="1"/><rect x="22" y="20" width="6" height="6" rx="1"/><rect x="36" y="20" width="6" height="6" rx="1"/><rect x="43" y="20" width="6" height="6" rx="1"/><rect x="50" y="20" width="6" height="6" rx="1"/>
    <rect x="8" y="27" width="6" height="6" rx="1"/><rect x="15" y="27" width="6" height="6" rx="1"/><rect x="22" y="27" width="6" height="6" rx="1"/><rect x="29" y="27" width="6" height="6" rx="1"/><rect x="36" y="27" width="6" height="6" rx="1"/><rect x="43" y="27" width="6" height="6" rx="1"/><rect x="50" y="27" width="6" height="6" rx="1"/>
    <rect x="8" y="34" width="6" height="6" rx="1"/><rect x="15" y="34" width="6" height="6" rx="1"/><rect x="22" y="34" width="6" height="6" rx="1"/><rect x="29" y="34" width="6" height="6" rx="1"/><rect x="36" y="34" width="6" height="6" rx="1"/><rect x="43" y="34" width="6" height="6" rx="1"/><rect x="50" y="34" width="6" height="6" rx="1"/>
    <rect x="8" y="41" width="6" height="6" rx="1"/><rect x="15" y="41" width="6" height="6" rx="1"/><rect x="22" y="41" width="6" height="6" rx="1"/><rect x="29" y="41" width="6" height="6" rx="1"/><rect x="36" y="41" width="6" height="6" rx="1"/><rect x="43" y="41" width="6" height="6" rx="1"/><rect x="50" y="41" width="6" height="6" rx="1"/>
    <rect x="8" y="48" width="6" height="6" rx="1"/><rect x="15" y="48" width="6" height="6" rx="1"/><rect x="22" y="48" width="6" height="6" rx="1"/><rect x="29" y="48" width="6" height="6" rx="1"/><rect x="36" y="48" width="6" height="6" rx="1"/><rect x="43" y="48" width="6" height="6" rx="1"/><rect x="50" y="48" width="6" height="6" rx="1"/>
  </g>
  <rect x="32.5" y="10" width="6" height="6" rx="1" fill="var(--mw-accent, #E8A33D)"/>
</svg>

# The alternative to the one-liner, for anybody who would rather keep their
# configuration in a file they can read next year.
#
# There is no database service, and there will not be one. SQLite lives in the
# volume beside its encryption key; adding Postgres would mean a second thing
# to back up, a second thing to upgrade, and a second thing to be down.
services:
  maverick-wall:
    image: ghcr.io/ambient-home-systems/maverick-wall:stable
    container_name: maverick-wall
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # The calendar, the settings and the key that decrypts the feed
      # addresses. Back this up and you have backed up everything.
      #
      # A named volume rather than `./data`, because the container runs as uid
      # 1000 and a folder you created belongs to you — on Linux it could not
      # write its own database. Swap in `./data:/data` if you would rather see
      # the files, and `chown -R 1000:1000 ./data` first.
      - maverick-wall:/data
    env_file:
      # Copy .env.example to .env first. Every variable is optional.
      - path: .env
        required: false
    # No healthcheck here: compose inherits the image's own `HEALTHCHECK`
    # (Dockerfile), which probes with `node` rather than `wget` — `wget` is
    # not in `node:22-bookworm-slim`, so a copy of this block using it would
    # report a permanently unhealthy container that is serving every request
    # correctly.

volumes:
  maverick-wall:

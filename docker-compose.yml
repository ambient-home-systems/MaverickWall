# The alternative to the one-liner, for anybody who would rather keep their
# configuration in a file they can read next year.
#
# There is no database service, and there will not be one. SQLite lives in the
# volume beside its encryption key; adding Postgres would mean a second thing
# to back up, a second thing to upgrade, and a second thing to be down.
services:
  maverick-wall:
    image: ghcr.io/ambient-home-systems/maverick-wall:stable
    container_name: maverick-wall
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # The calendar, the settings and the key that decrypts the feed
      # addresses. Back this up and you have backed up everything.
      - ./data:/data
    env_file:
      # Copy .env.example to .env first. Every variable is optional.
      - path: .env
        required: false
    # Matches the image's own healthcheck; stated here so `docker compose ps`
    # says something useful without inspecting the image.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# The add-on manifest.
#
# Two ways in, and they are not interchangeable:
#
#   - **Ingress** puts the settings in the Home Assistant sidebar, and Home
#     Assistant does the authentication. That is for a person on a phone or a
#     laptop who is already signed in.
#   - **The port** is for the wall displays. A screen screwed to a wall has no
#     Home Assistant session and cannot get one, so it connects straight to
#     8080 with its own display token. This is why `ports` is mapped at all;
#     without it there is a beautiful settings page and nothing to look at.
name: Maverick Wall
slug: maverick_wall
version: "0.1.0"
description: A family calendar for a wall display, with your Home Assistant calendars and sensors.
url: https://github.com/ambient-home-systems/MaverickWall
image: ghcr.io/ambient-home-systems/maverick-wall
arch:
  - aarch64
  - amd64
  - armv7

# Read-only, and that is a security property rather than a missing feature: a
# long-lived token cannot be scoped, so the limit lives on this side. Nothing
# in this application writes to Home Assistant.
homeassistant_api: true

ingress: true
ingress_port: 8080
# REQUIRED. The ingress proxy will not carry a WebSocket upgrade without it,
# and the display's push channel is a WebSocket. Without this the settings load
# and then quietly stop updating.
ingress_stream: true
panel_icon: mdi:calendar-month
panel_title: Wall

# The displays. Left null so Home Assistant asks rather than assuming 8080 is
# free — a household with something already on it should not have a failed
# start with no explanation.
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Wall displays connect here. Not needed for the settings, which use the sidebar.

# No `map` entry, deliberately.
#
# The supervisor already gives every add-on a persistent `/data`, which is
# exactly where this image keeps the database and the key — so the image's own
# DATA_DIR needs no override and the add-on's storage is included in a Home
# Assistant backup for free. Adding `addon_config` here would mount a second
# directory that nothing writes to, and leave whoever comes next wondering
# which of the two holds the calendar.
#
# The supervisor's own `/data/options.json` lives alongside `wall.db`. They are
# different files and neither touches the other.

# The image brings tini as its entrypoint, so the supervisor should not add its
# own init on top.
init: false

# One option, because one is all that does anything.
#
# `log_level` was here and controlled nothing — this application has no log
# levels, and a setting somebody can change with no effect is worse than a
# setting that does not exist. Everything else worth changing lives on a
# settings screen, next to an explanation of what it affects.
options:
  base_url: ""
schema:
  # Only needed for the wall displays. They connect to the add-on's port
  # rather than through ingress, and the pairing link they are handed comes
  # from this. Left empty it reads `localhost`, which is nowhere from a tablet.
  base_url: "str?"

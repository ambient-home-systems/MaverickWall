# The version catalog — one place the whole build reads its versions from.
#
# Kept deliberately small. This app is a WebView kiosk shell (see
# docs/rfc-003-android-tv-app.md); it does not rebuild the calendar, so it needs
# no rendering, charting, or networking stack beyond the platform's own WebView
# and a health probe. Compose is here only for the setup and status chrome.

[versions]
agp = "8.13.2"
kotlin = "2.0.20"
coreKtx = "1.13.1"
appcompat = "1.7.0"
lifecycle = "2.8.6"
coroutines = "1.8.1"
activityCompose = "1.9.2"
composeBom = "2024.09.03"
webkit = "1.11.0"
okhttp = "4.12.0"
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# The WebSocket push client and the trust-on-pairing cert pinner. Pure Java/Kotlin.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# The pairing QR encoder (Phase 3). Pure-Java, offline — nothing is fetched to
# draw it, in keeping with the no-cloud rule. `core` only: no camera/scanner.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# Compose, for the setup host-entry and status screens only — never the wall.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only support library set; the legacy one is long gone.
android.useAndroidX=true

# R8 full mode for the release build. The kiosk is tiny, but a smaller,
# obfuscated APK is a smaller sideload and a smaller attack surface.
android.enableR8.fullMode=true

kotlin.code.style=official

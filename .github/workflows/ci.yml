# What has to pass before anything ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds first, then tests. `vitest` only transpiles — it never resolves
      # a dependency's declarations, and packages/calendar passed 153 tests for
      # days over imports that `tsc` rejects outright.
      # The expansion budget is an algorithmic guard, not a benchmark of the
      # runner. A shared CI box is roughly twice as slow as a laptop, and the
      # thing this catches — a change that makes recurrence quadratic — is an
      # order of magnitude, not a factor of two.
      - run: pnpm test
        env:
          CALENDAR_BENCH_BUDGET_MS: 5000

  # The Android kiosk APK. Nothing else in CI touches apps/android — it is
  # excluded from the pnpm workspace and built with Gradle, not pnpm, so `test`
  # above never compiles a line of it. Without this the Kotlin could break and
  # every Node check stay green (the RFC 003 warning: a shipped app with a stale
  # message shape is a tablet that never wakes for a tornado warning). This
  # guards the app the way `test` guards the server and the display.
  #
  # assembleDebug compiles all the Kotlin, processes the resources and manifest,
  # and dexes — the whole "does it build into an APK" question. R8/release is a
  # Phase 4 concern (the signed release APK) and brings lint-vital flakiness, so
  # it is deliberately not run here yet.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Accepts the SDK licences and puts the command-line tools on PATH; the
      # runner's preinstalled platform-34 and build-tools satisfy compileSdk 34.
      - uses: android-actions/setup-android@v3
      # Caches ~/.gradle across runs, keyed on the wrapper and build files.
      - uses: gradle/actions/setup-gradle@v4
      # `--no-configuration-cache`: gradle.properties turns it on for local
      # iteration, but one Android resource task cannot serialise into it, which
      # fails the build — off here so a clean CI run is deterministic. No daemon
      # on a one-shot runner.
      - name: Build the debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache

  # The one-liner from the README, run exactly as written against a clean
  # volume. It is the first thing a stranger does and the only claim on the
  # front page, so it is the one thing that must never be broken by a change
  # nobody thought was about packaging.
  one-liner:
    # Only on pushes to main, never on pull requests. This job builds the full
    # image and boots it four ways — the expensive part of CI — to catch
    # packaging bugs that are release-blockers (uid 1000, the bind-mount
    # ownership case, the README one-liner). Releases are cut from main by tag,
    # so running this when something lands on main still catches a broken image
    # before it can ship; running it on every PR commit rebuilt the image for
    # each push and bought little the main-push run does not.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: maverick-wall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exactly the README's command, including the named volume. This runs on
      # Linux, which is the point: macOS Docker Desktop maps ownership across
      # its file sharing layer and hides the one failure that matters here.
      - name: Start it from nothing
        run: |
          docker run -d --name wall \
            -v maverick-wall:/data \
            -p 8080:8080 \
            maverick-wall:ci

      - name: Wait for the healthcheck to go green
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' wall 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' wall)" = "false" ] && break
            sleep 2
          done
          echo "never became healthy"; docker logs wall; exit 1

      - name: The wizard renders
        run: |
          set -e
          # A fresh volume must land on the first-run wizard, not an error and
          # not a blank page.
          code=$(curl -s -o /dev/null -w '%{http_code}' -L http://127.0.0.1:8080/)
          [ "$code" = "200" ] || { echo "root was $code"; docker logs wall; exit 1; }

          body=$(curl -sL http://127.0.0.1:8080/)
          echo "$body" | grep -q "Set up Maverick Wall" \
            || { echo "no wizard in the response"; echo "$body" | head -40; exit 1; }

          # And the bundle the wall needs is actually in the image — the asset
          # path resolves differently in a deployed tree than in a checkout,
          # and getting it wrong shows up as a wall that never draws.
          for asset in /assets/main.js /assets/display.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080${asset}")
            [ "$code" = "200" ] || { echo "$asset was $code"; exit 1; }
          done

          # The setup code is the only way in, and it has to reach the log.
          docker logs wall 2>&1 | grep -q "Nobody has set this up yet" \
            || { echo "no setup code in the log"; docker logs wall; exit 1; }

      # `docker exec` runs as the image's USER, which is root — there is no
      # USER line, deliberately, so the entrypoint can adopt a volume it does
      # not own. That says nothing about the application, which is the thing
      # that has to be unprivileged, so ask the process itself.
      #
      # Asserted three ways because the first two can both be true of a
      # container that quietly kept root: the process uid, the ownership of the
      # database it actually wrote, and NoNewPrivs.
      - name: The application runs as uid 1000, whatever the container started as
        run: |
          set -e
          pid=$(docker exec wall sh -c '
            for p in /proc/[0-9]*; do
              [ -r "$p/cmdline" ] || continue
              case "$(tr "\0" " " < "$p/cmdline")" in
                node\ /app/dist/main.js*) echo "${p#/proc/}"; break ;;
              esac
            done')
          [ -n "$pid" ] || { echo "no application process found"; docker logs wall; exit 1; }

          uid=$(docker exec wall awk '/^Uid:/{print $2}' "/proc/$pid/status")
          [ "$uid" = "1000" ] || { echo "application runs as uid $uid, not 1000"; exit 1; }

          nnp=$(docker exec wall awk '/^NoNewPrivs:/{print $2}' "/proc/$pid/status")
          [ "$nnp" = "1" ] || { echo "NoNewPrivs is $nnp; privileges can be regained"; exit 1; }

          owner=$(docker exec wall stat -c '%u' /data/wall.db)
          [ "$owner" = "1000" ] || { echo "the database was written by uid $owner"; exit 1; }

      # The case a real Home Assistant supervisor found, and the one that made
      # the USER line untenable: it creates the add-on's /data itself, owned by
      # root, with no option anywhere to change it. The add-on installed and
      # could never start.
      #
      # A *non-empty* volume is what reproduces it. Docker copies the image's
      # ownership onto an empty named volume, which silently repairs the very
      # thing under test — the first attempt at this test passed against the
      # broken image for exactly that reason.
      - name: A volume owned by root is adopted, not refused
        run: |
          set -e
          docker volume create rooted >/dev/null
          docker run --rm -v rooted:/data alpine sh -c 'touch /data/keep && chown -R 0:0 /data'

          docker run -d --name wall2 -v rooted:/data -p 8081:8080 maverick-wall:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' wall2)" = "healthy" ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' wall2)" = "healthy" ] \
            || { echo "never became healthy"; docker logs wall2; exit 1; }

          docker logs wall2 2>&1 | grep -q "Taking ownership" \
            || { echo "it started, but never said it had taken the directory"; exit 1; }

      # A bind mount the host owns needs no chown any more either. It is still
      # not what the README recommends — a named volume is — but somebody who
      # does it anyway gets a working wall rather than a message.
      - name: A bind mount the container does not own still works
        run: |
          set -e
          mkdir -p "${RUNNER_TEMP}/bind"
          docker run -d --name wall3 -v "${RUNNER_TEMP}/bind:/data" -p 8082:8080 maverick-wall:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' wall3)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "bind mount never became healthy"; docker logs wall3; exit 1

      # Rule eleven has not moved: what cannot be fixed still has to be
      # explained. Read-only is the case root cannot chown its way out of, and
      # the message has to name that rather than repeat advice about chown.
      - name: A read-only volume still says so, and says why
        run: |
          set -e
          out=$(docker run --rm -v rooted:/data:ro maverick-wall:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "could not fix it" \
            || { echo "expected the entrypoint's message"; exit 1; }
          echo "$out" | grep -q "read-only" \
            || { echo "the message did not name the actual cause"; exit 1; }

      - name: Show the logs either way
        if: always()
        run: |
          for c in wall wall2 wall3; do
            echo "::group::$c"; docker logs "$c" 2>&1 || true; echo "::endgroup::"
          done

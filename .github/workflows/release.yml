# Tag → build for both architectures → sign → push → SBOM.
#
# Signing and the bill of materials are not ceremony here: this ships code to
# other people's machines, on hardware nobody can reach, and there is no way to
# patch a household remotely. Somebody has to be able to check that the image
# they pulled is the one this repository built.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required for keyless signing: cosign exchanges this for a short-lived
  # certificate, so there is no long-lived key to leak or rotate.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/maverick-wall

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `stable` moves only for a real release, never for a pre-release —
          # it is what docker-compose.yml points at, so a household that never
          # thinks about tags gets releases and not release candidates.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=raw,value=stable,enable=${{ !contains(github.ref, '-') }}
          # Stated here, not left to be derived.
          #
          # This action builds its labels from the GitHub repository API and
          # passes them to the build, where they override the `LABEL` lines in
          # the Dockerfile. v0.1.0 went out with
          # `org.opencontainers.image.licenses=` — empty — because the API had
          # not detected the licence yet. That is the field scanners and
          # registries read, and a blank one on an AGPL image is worse than
          # silence: it reads as "no licence stated".
          labels: |
            org.opencontainers.image.title=Maverick Wall
            org.opencontainers.image.description=A self-hosted family calendar for a wall display.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is not an afterthought: a Raspberry Pi and a Synology are the
          # two likeliest machines this ever runs on.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed by digest rather than by tag: a tag can be moved afterwards and
      # a digest cannot, so this is a signature over the bytes somebody pulls.
      #
      # Fetch the OIDC token ourselves, with retries, rather than let cosign do
      # it. Keyless signing needs one GitHub OIDC token; cosign fetches it
      # automatically, but a *single* flaky fetch — a TLS handshake timeout to
      # the Actions OIDC endpoint, which is exactly what killed the first
      # v0.16.0 run — makes cosign fall back to an interactive device flow. That
      # flow cannot complete on a runner, so it hangs to a 300s "expired_token"
      # and the release fails with the image already pushed but unsigned. Fetching
      # the token here (curl retries on the transient error) and handing it to
      # cosign with --identity-token means there is no ambient detection and no
      # interactive fallback to hang on, and the whole sign is retried besides.
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          fetch_token() {
            curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r '.value'
          }
          for attempt in 1 2 3; do
            token=$(fetch_token) || { echo "OIDC token fetch attempt ${attempt} failed"; sleep 10; continue; }
            if cosign sign --yes --identity-token="${token}" "${IMAGE}@${DIGEST}"; then
              echo "signed on attempt ${attempt}"
              exit 0
            fi
            echo "cosign sign attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::cosign keyless signing failed after 3 attempts (OIDC or Fulcio). Usually transient — re-run this job."
          exit 1

      - name: Attach the bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          upload-artifact: true

  # A tag and a config bump ship independently of the image, and once did:
  # v0.1.9's build never ran (the hosted runner was never acquired), so the git
  # tag and `config.yaml: version: 0.1.9` went out while `:0.1.9` was a 404 in
  # the registry. A "completed (failed)" release makes no noise, so the first
  # thing that noticed was a household's supervisor pulling a tag that did not
  # exist, three days later, and reporting it as an "unknown error".
  #
  # This job is the guard: after the release, pull the version tag exactly the
  # way a supervisor does — anonymously, no credentials, over the public
  # registry — and fail loudly here if it is missing or does not cover both
  # declared architectures. A red release with no image should stop at CI, not
  # in somebody's kitchen.
  verify:
    name: Verify the published image is pullable
    needs: release
    runs-on: ubuntu-latest
    # No login step, deliberately. The whole point is to prove the anonymous
    # pull works — the path a household takes, and the one that was silently
    # broken. A logged-in check would hide exactly the failure this catches
    # (a package still private, a tag not actually pushed).
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: The version tag resolves, for both architectures
        run: |
          # `type=semver,pattern={{version}}` strips the leading v, so the
          # image tag for v0.1.9 is 0.1.9 — mirror that here.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Anonymously inspecting ${IMAGE}:${VERSION} (no credentials, as a supervisor pulls it)"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw > manifest.json
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          data = json.load(open("manifest.json"))
          # Attestations ride in the same index as os/architecture "unknown";
          # only the real image manifests carry a concrete platform.
          platforms = {
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in data.get("manifests", [])
              if m.get("platform", {}).get("os") not in (None, "unknown")
          }
          print("Published platforms:", sorted(platforms))
          # These must match config.yaml's `arch:` — a declared architecture is
          # a promise about the image, and an unbuilt one fails at `docker pull`
          # only after the household has pressed the button.
          required = {"linux/amd64", "linux/arm64"}
          missing = required - platforms
          if missing:
              print(f"::error::{version} is missing {sorted(missing)}")
              sys.exit(1)
          PY

      - name: And it pulls for real
        run: |
          # imagetools reads the manifest; this fetches the blobs, so a tag that
          # resolves but whose layers never landed still fails here.
          VERSION="${GITHUB_REF_NAME#v}"
          docker pull "${IMAGE}:${VERSION}"

      # And it is signed by this workflow. The Sign step can fail while the image
      # is already pushed (a flaky OIDC fetch), leaving a published-but-unsigned
      # image on `stable` — which the README and the checklist both tell a
      # household to `cosign verify`. That is a silent break the pull checks above
      # do not catch, so assert the signature here, anonymously, the way anyone
      # verifying it would. A short retry rides out registry propagation of the
      # freshly pushed signature.
      - name: And it is signed by this workflow
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if cosign verify "${IMAGE}:${VERSION}" \
                 --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
                 --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null 2>&1; then
              echo "signature verified for ${IMAGE}:${VERSION} (attempt ${attempt})"
              exit 0
            fi
            echo "verify attempt ${attempt}: signature not confirmed yet; waiting 10s"
            sleep 10
          done
          echo "::error::${IMAGE}:${VERSION} is published but has no valid cosign signature from this workflow — the Sign step likely failed while the push succeeded. Do not leave it on stable; re-run the release job."
          exit 1
